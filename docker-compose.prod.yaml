# Producción en un VPS (ADR 0017). Uso: deploy/deploy.sh. Lee el .env de la raíz (copia de deploy/.env.prod.example).
name: kaizen
# Disco de 320 GB: sin límite los logs de Docker crecen sin parar.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
services:
  db:
    logging: *logging
    image: postgres:16
    restart: unless-stopped
    # Ajuste para el VPS de 16 GB (netcup VPS Lite 3), compartido con la API y nginx.
    shm_size: 1g
    command: postgres -c shared_buffers=4GB -c effective_cache_size=10GB -c work_mem=16MB -c maintenance_work_mem=256MB -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
      SERVICE_PASSWORD: ${SERVICE_PASSWORD}
      DB_NAME: ${DB_NAME:-kaizen}
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/staging/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    logging: *logging
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    # Solo lo que lee la API (nombre sin valor = se toma del .env): sin POSTGRES_*, contraseñas de BD ni DATABASE_URL de migrator.
    environment:
      - DATABASE_URL_APP
      - DATABASE_URL_SERVICE
      - APP_URL
      - TRUST_PROXY
      - GOOGLE_CLIENT_ID
      - JWT_SECRET
      - JWT_EXPIRES_IN
      - ADMIN_JWT_EXPIRES_IN
      - MFA_ENCRYPTION_KEY
      - MFA_TOKEN_EXPIRES_IN
      - MFA_TOTP_ISSUER
      - MFA_RECOVERY_CODE_COUNT
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET
      - STRIPE_PORTAL_CONFIGURATION_ID
      - STRIPE_STATEMENT_DESCRIPTOR
      - EMAIL_TRANSPORT
      - RESEND_API_KEY
      - BREVO_API_KEY
      - BREVO_WEBHOOK_SECRET
      - CORPORATE_EMAIL_DOMAIN
      - EMAIL_FROM
      - EMAIL_REPLY_TO
      - PUSH_TRANSPORT
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - VAPID_SUBJECT
      - PORT=3000
      - AGREEMENTS_STORAGE_PATH=/app/storage/agreements # las fotos (avatars) y los logs cuelgan del mismo storage/
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Solo bajo demanda: docker compose run --rm migrate
  migrate:
    logging: *logging
    build: { context: ., target: migrate }
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    environment:
      - DATABASE_URL # rol migrator

  web:
    logging: *logging
    build:
      context: .
      target: web
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    # TLS en este contenedor (un solo salto de proxy: TRUST_PROXY=1). Certificados: deploy/tls-init.sh.
    # Sin registros AAAA en el DNS: Docker enmascara la IP de los clientes IPv6 (rompería el rate limit por IP).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/kaizen/certs:/etc/nginx/certs:ro
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  db:
  storage:
