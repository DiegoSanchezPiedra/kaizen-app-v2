# Kaizen: un solo dominio (ADR 0013). La API bajo /api/ quitando el prefijo; el resto, la PWA de frontend/dist.
# Plantilla del server block: el certificado (TLS) y el server_name los pone el despliegue.
server {
    listen 80;
    server_name _;

    root /srv/kaizen/frontend/dist;
    index index.html;

    # ADR 0014: el JWT vive en localStorage, así que la CSP es estricta y sin scripts inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; connect-src 'self' https://accounts.google.com https://api.stripe.com; worker-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # El token de recuperar contraseña va en la URL: que no salga en el Referer.
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ADR 0015: nada de la API se guarda en la caché HTTP del navegador.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # SSE de la tablet (B18.5): sin buffer para que cada evento llegue al momento.
    location /api/tablet/ {
        proxy_pass http://127.0.0.1:3000/tablet/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Ficheros con hash en el nombre: caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # El resto, la SPA (incluidas las rutas que el backend enlaza: /billing, /bookings, /agreements…).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; frame-src https://accounts.google.com https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; connect-src 'self' https://accounts.google.com https://api.stripe.com; worker-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
